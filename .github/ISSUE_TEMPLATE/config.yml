blank_issues_enabled: false
contact_links:
  - name: Bug in the app itself (not the cask)
    url: https://github.com/jmanuelrosa/triage/issues/new/choose
    about: For routing bugs, crashes, or feature requests in Triage, file the issue in the app's repo — not here. Issues in this repo are scoped to the cask (install/update problems).
  - name: Question or "is this the right tool for me?"
    url: https://github.com/jmanuelrosa/triage/discussions
    about: Usage and config questions belong in the app repo's Discussions.
  - name: Security vulnerability
    url: https://github.com/jmanuelrosa/triage/security/advisories/new
    about: Don't open a public issue for security reports. Use a private Security Advisory in the app's repo.
